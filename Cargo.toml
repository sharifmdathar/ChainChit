[workspace]
resolver = "2"
members = [
    "contracts/chit_group",
    "contracts/reputation",
    "contracts/identity",
    "contracts/dispute",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = true
lto = true
codegen-units = 1
panic = "abort"
