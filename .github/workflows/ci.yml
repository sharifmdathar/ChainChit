name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-contracts:
    name: Build Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: contracts-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: contracts-${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --target wasm32v1-none --release

  test-contracts:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: contracts-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: contracts-${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cargo test

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun next lint

  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [typecheck-frontend, test-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_NETWORK: TESTNET
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_FACTORY_CONTRACT: CAYOIBPQO4QK6Q3YD4OYDMFRV4BLFZMQ3NVFUB522VHVC62ZPT5OXUBB
          NEXT_PUBLIC_REPUTATION_CONTRACT: CC3SIQEZZCZMCFZRHDOHCVV5WG4JU6XZEZCO3MKF5IX6OKME2Y7KDPA7
          NEXT_PUBLIC_IDENTITY_CONTRACT: CAOU576ZR4LZKOD4TM7JQHG2YOGYTHP4REPKM46VRSU4OG7UXIHR6R5X
          NEXT_PUBLIC_DISPUTE_CONTRACT: CC5SAVATGNP4G5IXAOZ4OF4PVS34D4RCCJHVHHSOJD2XHTAJR6IC6BBW
          NEXT_PUBLIC_USDC_CONTRACT: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA

